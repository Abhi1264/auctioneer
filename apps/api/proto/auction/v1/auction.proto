syntax = "proto3";

package auction.v1;
option go_package = "github.com/Abhi1264/auctioneer/apps/api/gen/auction/v1;auctionv1";

service AuctionService {
  rpc CreateAuction(CreateAuctionRequest) returns (Empty);
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse);
}

message CreateAuctionRequest {
  string auction_id = 1;
  int64 opening_price_cents = 2;
  int64 duration_sec = 3;
}

message PlaceBidRequest {
  string auction_id = 1;
  string bid_id = 2;
  string user_id = 3;
  int64 amount_cents = 4;
  int64 client_ts_ms = 5;
}

message PlaceBidResponse {
  bool accepted = 1;
  bool duplicate = 2;
  string reason = 3;
  int64 current_price_cents = 4;
  string winner_user_id = 5;
  int64 version = 6;
  string event_id = 7;
  int64 server_ts_ms = 8;
}

message Empty {}
